name: Model and recovery checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/operations.js
      - run: node --test tests/model.test.cjs tests/recovery.test.cjs
